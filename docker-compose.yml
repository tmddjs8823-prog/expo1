services:
  postgres:
    image: postgres:17-alpine
    container_name: expo-db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: expo
      POSTGRES_PASSWORD: expopass
      POSTGRES_DB: expo
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
