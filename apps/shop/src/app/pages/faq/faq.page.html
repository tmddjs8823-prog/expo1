<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col gap-8">

  <!-- 헤더 -->
  <div class="text-center flex flex-col gap-2" appFadeUp>
    <p class="text-sm text-emerald-600 font-semibold uppercase tracking-wider">FAQ</p>
    <h1 class="text-3xl font-bold text-slate-900">자주 묻는 질문</h1>
    <p class="text-slate-500">궁금한 점이 있으시면 아래에서 확인해보세요.</p>
  </div>

  <!-- 검색 (상단으로 이동) -->
  <div class="flex justify-center" appFadeUp="100ms">
    <div class="relative w-full max-w-md">
      <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)"
             name="search" placeholder="질문을 검색하세요..."
             class="w-full pl-4 pr-10 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
      <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
  </div>

  <!-- 카테고리 탭 -->
  <div class="flex items-center justify-center gap-2 flex-wrap" appFadeUp="150ms">
    <button (click)="selectCategory(null)"
            class="px-4 py-2 text-sm font-medium rounded-full transition-all"
            [class]="selectedCategoryId() === null
              ? 'bg-emerald-600 text-white shadow-md'
              : 'border border-slate-200 text-slate-600 hover:bg-slate-50'">
      전체
    </button>
    @for (cat of categories(); track cat.id) {
      <button (click)="selectCategory(cat.id)"
              class="px-4 py-2 text-sm font-medium rounded-full transition-all"
              [class]="selectedCategoryId() === cat.id
                ? 'bg-emerald-600 text-white shadow-md'
                : 'border border-slate-200 text-slate-600 hover:bg-slate-50'">
        {{ cat.name }}
      </button>
    }
  </div>

  <!-- FAQ 아코디언 목록 -->
  <div class="flex flex-col gap-3" appFadeUp="200ms">
    @for (faq of pagedFaqs(); track faq.id) {
      <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm hover:shadow-md transition-all">
        <!-- 질문 -->
        <button (click)="toggleExpand(faq.id)"
                class="w-full flex items-center gap-4 px-6 py-4 text-left hover:bg-slate-50 transition-colors">
          <span class="shrink-0 w-8 h-8 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center font-bold text-sm">Q</span>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-900 line-clamp-2">{{ faq.question }}</p>
            @if (faq.category) {
              <span class="text-xs text-slate-400">{{ faq.category.name }}</span>
            }
          </div>
          <svg class="w-5 h-5 text-slate-400 shrink-0 transition-transform duration-300"
               [class.rotate-180]="expandedId() === faq.id"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <!-- 답변 -->
        @if (expandedId() === faq.id) {
          <div class="px-6 pb-5 pt-0 ml-12 border-t border-slate-100">
            <div class="flex items-start gap-3 pt-4">
              <span class="shrink-0 w-8 h-8 bg-primary-50 text-primary-600 rounded-lg flex items-center justify-center font-bold text-sm">A</span>
              <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-line flex-1">{{ faq.answer }}</p>
            </div>
          </div>
        }
      </div>
    } @empty {
      <div class="py-12 text-center text-slate-400">등록된 FAQ가 없습니다.</div>
    }
  </div>

  <!-- 페이지네이션 -->
  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)" />

</div>
