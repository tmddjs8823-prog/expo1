<!-- 문의 완료 화면 -->
@if (submitted()) {
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-green-100 flex items-center justify-center">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">문의가 접수되었습니다</h1>
    <p class="text-slate-500 mb-8">
      빠른 시일 내에 답변드리겠습니다.<br />
      입력하신 이메일로 답변 안내를 드릴 예정입니다.
    </p>
    <a routerLink="/"
       class="inline-flex items-center px-6 py-2.5 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors">
      홈으로 돌아가기
    </a>
  </div>
} @else {

  <!-- 문의하기 폼 -->
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900">문의하기</h1>
      <p class="mt-2 text-slate-500">광주 밀리언쇼에 대해 궁금한 점을 남겨주세요.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- 이름 -->
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">
          이름 <span class="text-red-500">*</span>
        </label>
        <input id="name" type="text" [(ngModel)]="name" name="name"
               placeholder="홍길동"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" />
      </div>

      <!-- 이메일 / 전화번호 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
            이메일 <span class="text-red-500">*</span>
          </label>
          <input id="email" type="email" [(ngModel)]="email" name="email"
                 placeholder="example@email.com"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" />
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">전화번호</label>
          <input id="phone" type="tel" [(ngModel)]="phone" name="phone"
                 placeholder="010-1234-5678"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" />
        </div>
      </div>

      <!-- 제목 -->
      <div>
        <label for="subject" class="block text-sm font-medium text-slate-700 mb-1">
          제목 <span class="text-red-500">*</span>
        </label>
        <input id="subject" type="text" [(ngModel)]="subject" name="subject"
               placeholder="문의 제목을 입력해주세요"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" />
      </div>

      <!-- 내용 -->
      <div>
        <label for="content" class="block text-sm font-medium text-slate-700 mb-1">
          내용 <span class="text-red-500">*</span>
        </label>
        <textarea id="content" [(ngModel)]="content" name="content" rows="6"
                  placeholder="문의 내용을 자세히 작성해주세요"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors resize-none"></textarea>
      </div>

      <!-- 에러 메시지 -->
      @if (errorMessage()) {
        <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600">
          {{ errorMessage() }}
        </div>
      }

      <!-- 제출 버튼 -->
      <div class="pt-2">
        <button type="submit" [disabled]="submitting()"
                class="w-full py-3 px-6 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          @if (submitting()) {
            접수 중...
          } @else {
            문의하기
          }
        </button>
      </div>
    </form>
  </div>
}
