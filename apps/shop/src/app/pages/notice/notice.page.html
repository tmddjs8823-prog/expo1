<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

  <!-- 헤더 -->
  <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8" appFadeUp>
    <div>
      <p class="text-sm text-amber-600 font-semibold uppercase tracking-wider mb-1">NOTICE</p>
      <h1 class="text-3xl font-bold text-slate-900">공지사항</h1>
      <p class="text-slate-500 mt-1">광주 밀리언쇼의 주요 소식을 확인하세요.</p>
    </div>
  </div>

  <!-- 검색 -->
  <div class="flex justify-center mb-6" appFadeUp="100ms">
    <div class="relative w-full max-w-md">
      <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)"
             name="search" placeholder="검색어를 입력하세요"
             class="w-full pl-4 pr-10 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" />
      <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
  </div>

  <!-- 공지사항 목록 -->
  <div class="border-t-2 border-slate-900" appFadeUp="200ms">
    <table class="w-full">
      <thead>
        <tr class="border-b border-slate-200">
          <th class="py-3 px-4 text-center text-sm font-semibold text-slate-700 w-20">번호</th>
          <th class="py-3 px-4 text-left text-sm font-semibold text-slate-700">제목</th>
          <th class="py-3 px-4 text-right text-sm font-semibold text-slate-700 w-32">작성일</th>
        </tr>
      </thead>
      <tbody>
        @for (notice of pagedNotices(); track notice.id) {
          <tr class="border-b border-slate-100 transition-colors"
              [class.bg-slate-100]="notice.isPinned"
              [class.hover:bg-slate-50]="!notice.isPinned">
            <td class="py-3.5 px-4 text-sm text-center"
                [class.text-slate-600]="notice.isPinned"
                [class.font-bold]="notice.isPinned"
                [class.text-slate-400]="!notice.isPinned">
              @if (notice.isPinned) { 고정 } @else { {{ getNoticeNumber(notice) }} }
            </td>
            <td class="py-3.5 px-4 text-sm"
                [class.text-slate-900]="!notice.isPinned"
                [class.text-slate-800]="notice.isPinned"
                [class.font-semibold]="notice.isPinned">
              <a [routerLink]="['/notice', notice.id]"
                 class="hover:text-primary-600 hover:underline transition-colors">
                {{ notice.title }}
              </a>
            </td>
            <td class="py-3.5 px-4 text-sm text-slate-400 text-right">{{ notice.createdAt | date:'yyyy-MM-dd' }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="py-12 text-center text-slate-400">등록된 공지사항이 없습니다.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- 페이지네이션 -->
  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)" />

</div>
