@if (notice(); as n) {
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col gap-6">

    <!-- 뒤로가기 -->
    <a routerLink="/notice"
       class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      공지사항 목록으로 돌아가기
    </a>

    <!-- 제목 + 날짜 -->
    <div class="border-b border-slate-200 pb-6">
      <h1 class="text-2xl font-bold text-slate-900 mb-3">{{ n.title }}</h1>
      <div class="flex items-center gap-4 text-sm text-slate-400">
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          {{ n.createdAt | date:'yyyy.MM.dd' }}
        </div>
      </div>
    </div>

    <!-- 내용 -->
    <div class="prose prose-slate max-w-none">
      <p class="text-slate-600 leading-relaxed whitespace-pre-line">{{ n.content }}</p>
    </div>

    <!-- 목록 버튼 -->
    <div class="pt-6 border-t border-slate-200">
      <a routerLink="/notice"
         class="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-900 text-white text-sm font-medium rounded-lg hover:bg-slate-800 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg>
        목록으로
      </a>
    </div>

  </div>
} @else {
  <div class="max-w-4xl mx-auto px-4 py-20 text-center text-slate-400">
    공지사항을 불러오는 중...
  </div>
}
