<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="text-center">
    @if (error()) {
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-100 text-red-500 mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </div>
      <h2 class="text-lg font-bold text-slate-900 mb-2">로그인 실패</h2>
      <p class="text-sm text-slate-500 mb-6">{{ error() }}</p>
      <a routerLink="/auth/login"
        class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 transition-colors">
        로그인 페이지로 이동
      </a>
    } @else {
      <div class="w-10 h-10 border-3 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-sm text-slate-500">카카오 로그인 처리 중...</p>
    }
  </div>
</div>
