<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <!-- 헤더 -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900">로그인</h1>
      <p class="mt-1 text-sm text-slate-500">광주 밀리언쇼 계정으로 로그인하세요.</p>
    </div>

    <!-- 카드 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

      <form (ngSubmit)="login()" class="flex flex-col gap-5">
        <!-- 아이디 -->
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-slate-700">아이디</span>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)"
              name="username" placeholder="아이디를 입력하세요" autocomplete="username"
              class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all" />
          </div>
        </label>

        <!-- 비밀번호 -->
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-slate-700">비밀번호</span>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
              name="password" placeholder="••••••••" autocomplete="current-password"
              class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all" />
          </div>
        </label>

        <!-- 에러 메시지 -->
        @if (error()) {
          <div class="flex items-center gap-2 p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
            {{ error() }}
          </div>
        }

        <!-- 로그인 버튼 -->
        <button type="submit" [disabled]="loading()"
          class="w-full py-2.5 bg-primary-600 text-white text-sm font-semibold rounded-lg hover:bg-primary-700 active:bg-primary-800 shadow-sm shadow-primary-500/20 transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-1">
          @if (loading()) {
            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25" />
              <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" class="opacity-75" />
            </svg>
            로그인 중...
          } @else {
            로그인
          }
        </button>

        <!-- 아이디/비밀번호 찾기 -->
        <div class="flex items-center justify-center gap-3">
          <a routerLink="/auth/find-id" class="text-sm text-slate-500 hover:text-primary-600 font-medium transition-colors">
            아이디 찾기
          </a>
          <span class="text-slate-300">|</span>
          <a routerLink="/auth/find-password" class="text-sm text-slate-500 hover:text-primary-600 font-medium transition-colors">
            비밀번호 찾기
          </a>
        </div>
      </form>

      <!-- 구분선 -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400">또는</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <!-- 카카오 로그인 -->
      <button (click)="kakaoLogin()" type="button"
        class="w-full py-2.5 bg-[#FEE500] text-[#191919] text-sm font-semibold rounded-lg hover:bg-[#FADA0A] active:bg-[#F5D000] transition-all flex items-center justify-center gap-2">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3C6.48 3 2 6.36 2 10.44c0 2.62 1.75 4.93 4.38 6.24l-1.12 4.12c-.1.36.27.65.58.46l4.88-3.22c.42.04.84.06 1.28.06 5.52 0 10-3.36 10-7.66C22 6.36 17.52 3 12 3z"/>
        </svg>
        카카오 로그인
      </button>
    </div>

    <!-- 회원가입 링크 -->
    <div class="text-center mt-6">
      <p class="text-sm text-slate-500">
        아직 계정이 없으신가요?
        <a routerLink="/auth/register" class="text-primary-600 hover:text-primary-700 font-semibold transition-colors">
          회원가입
        </a>
      </p>
    </div>

  </div>
</div>
