<div class="flex flex-col gap-4 p-6">
  <h1 class="text-2xl font-bold">갤러리 관리</h1>

  <!-- 생성/수정 폼 -->
  <form (submit)="$event.preventDefault()"
    class="bg-white p-6 rounded shadow flex flex-col gap-4">

    <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)"
      name="title" placeholder="제목" class="w-full p-2 border rounded">

    <textarea [ngModel]="description()" (ngModelChange)="description.set($event)"
      name="description" placeholder="설명" rows="3" class="w-full p-2 border rounded"></textarea>

    <!-- 이미지 업로드 -->
    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-gray-700">이미지</span>
      <input #galleryFileInput type="file" accept="image/*" (change)="onFileSelected($event)"
        class="hidden">
      <button type="button" (click)="galleryFileInput.click()"
        class="px-4 py-2 bg-gray-100 border rounded hover:bg-gray-200 text-sm text-gray-700 w-fit">
        파일 선택
      </button>
      @if (imageUrl()) {
        <img [src]="imageUrl()" alt="미리보기" class="w-32 h-32 object-cover rounded">
      }
    </div>

    <label class="flex items-center gap-2 text-sm select-none cursor-pointer">
      <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
        name="published" class="w-4 h-4" />
      공개
    </label>

    <div class="flex gap-2">
      <button type="button" (click)="isEditing() ? updateGallery() : createGallery()" [disabled]="uploading()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
        @if (uploading()) {
          업로드 중...
        } @else {
          {{ isEditing() ? '수정' : '생성' }}
        }
      </button>

      @if (isEditing()) {
        <button type="button" (click)="resetForm()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          취소
        </button>
      }
    </div>
  </form>

  <!-- ── 갤러리 목록 (공통 그리드) ── -->
  <app-data-grid
    [items]="pagedGalleries()"
    [searchKeyword]="searchKeyword()"
    (searchChange)="searchKeyword.set($event)"
    searchPlaceholder="제목, 설명으로 검색"
    emptyMessage="등록된 갤러리가 없습니다."
    [columns]="['미리보기','제목','공개여부','작성일','관리']"
    [rowClickable]="true"
    (rowClick)="router.navigate(['/gallery', $event.id])"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)">

    <ng-template appGridRow let-gallery>
      <td class="p-3">
        <img [src]="gallery.imageUrl" [alt]="gallery.title"
          class="w-16 h-16 object-cover rounded">
      </td>
      <td class="p-3 truncate" [title]="gallery.title">{{ gallery.title }}</td>
      <td class="p-3">
        @if (gallery.published) {
          <span class="text-green-600">공개</span>
        } @else {
          <span class="text-red-500">비공개</span>
        }
      </td>
      <td class="p-3 whitespace-nowrap">{{ gallery.createdAt | date:'yy-MM-dd' }}</td>
      <td class="p-3">
        <button (click)="$event.stopPropagation(); deleteGallery(gallery.id)"
          class="text-red-600 hover:underline">삭제</button>
      </td>
    </ng-template>
  </app-data-grid>
</div>
