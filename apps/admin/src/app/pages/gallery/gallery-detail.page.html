<div class="flex flex-col gap-4">
  <app-page-header title="갤러리 상세" backLabel="목록" (backClick)="goBack()" />

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateGallery()">
    <label class="flex flex-col gap-1">
      제목
      <input [ngModel]="title()" (ngModelChange)="title.set($event)"
        name="title" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      설명
      <textarea [ngModel]="description()" (ngModelChange)="description.set($event)"
        name="description" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-gray-700">이미지</span>
      @if (imageUrl()) {
        <img [src]="imageUrl()" alt="미리보기" class="w-48 h-48 object-cover rounded border" />
      }
      <input #galleryDetailFileInput type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
      <button type="button" (click)="galleryDetailFileInput.click()"
        class="px-4 py-2 bg-gray-100 border rounded hover:bg-gray-200 text-sm text-gray-700 w-fit">
        파일 선택
      </button>
    </div>

    <label class="flex items-center gap-2 text-sm select-none cursor-pointer">
      <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
        name="published" class="w-4 h-4" />
      공개
    </label>

    <div class="flex gap-2">
      <button type="submit" [disabled]="uploading()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
        {{ uploading() ? '업로드 중...' : '수정' }}
      </button>
      <button type="button" (click)="deleteGallery()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
