<div class="flex h-screen">
  <!-- 좌측: 브랜딩 패널 -->
  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-slate-900 via-slate-800 to-primary-900 flex-col items-center justify-center p-12 relative overflow-hidden">
    <!-- 배경 장식 -->
    <div class="absolute top-0 left-0 w-full h-full opacity-10">
      <div class="absolute top-20 left-16 w-72 h-72 bg-primary-500 rounded-full blur-3xl"></div>
      <div class="absolute bottom-20 right-16 w-96 h-96 bg-primary-400 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 text-center max-w-md">
      <div class="w-16 h-16 rounded-2xl bg-primary-600 flex items-center justify-center text-white text-2xl font-bold mx-auto mb-8 shadow-lg shadow-primary-600/30">
        E
      </div>
      <h1 class="text-3xl font-bold text-white mb-3">EXPO Admin</h1>
      <p class="text-slate-400 text-base leading-relaxed">
        전시회 운영을 위한 관리자 시스템입니다.<br>
        공지, 프로그램, 참가업체 등을 관리하세요.
      </p>
    </div>
  </div>

  <!-- 우측: 로그인 폼 -->
  <div class="flex-1 flex items-center justify-center bg-slate-50 px-6">
    <div class="w-full max-w-sm">
      <!-- 모바일 로고 -->
      <div class="lg:hidden flex items-center justify-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-primary-600 flex items-center justify-center text-white text-lg font-bold shadow-sm">E</div>
        <span class="text-xl font-bold text-slate-900">EXPO Admin</span>
      </div>

      <h2 class="text-2xl font-bold text-slate-900 mb-1">로그인</h2>
      <p class="text-sm text-slate-500 mb-8">관리자 계정으로 로그인하세요.</p>

      @if (error()) {
        <div class="flex items-center gap-2 p-3 mb-4 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="login()" class="flex flex-col gap-4">
        <!-- 이메일 -->
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-slate-700">이메일</span>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
              name="email" placeholder="admin@expo.com" autocomplete="email"
              class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
          </div>
        </label>

        <!-- 비밀번호 -->
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-slate-700">비밀번호</span>
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
              name="password" placeholder="••••••••" autocomplete="current-password"
              class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
          </div>
        </label>

        <!-- 로그인 버튼 -->
        <button type="submit" [disabled]="loading()"
          class="w-full py-2.5 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 active:bg-primary-800 shadow-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-2">
          @if (loading()) {
            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25" />
              <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" class="opacity-75" />
            </svg>
            로그인 중...
          } @else {
            로그인
          }
        </button>
      </form>
    </div>
  </div>
</div>
