<div class="flex items-center justify-center h-screen bg-gray-100">
  <form (ngSubmit)="login()" class="bg-white p-8 rounded shadow w-96 flex flex-col gap-4">
    <h1 class="text-xl font-bold text-center">관리자 로그인</h1>

    @if (error()) {
      <p class="text-red-500 text-sm text-center">{{ error() }}</p>
    }

    <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
      name="email" placeholder="이메일" class="w-full p-2 border rounded" />

    <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
      name="password" placeholder="비밀번호" class="w-full p-2 border rounded" />

    <button type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
      로그인
    </button>
  </form>
</div>
