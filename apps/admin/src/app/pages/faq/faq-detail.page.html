<div class="flex flex-col gap-4 p-6">
  <div class="flex items-center gap-4">
    <button (click)="goBack()" class="text-gray-500 hover:text-gray-700">← 목록</button>
    <h1 class="text-2xl font-bold">FAQ 상세</h1>
  </div>

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateFaq()">
    <label class="flex flex-col gap-1">
      카테고리
      <select [ngModel]="selectedCategoryId()" (ngModelChange)="selectedCategoryId.set($event)"
        name="categoryId" class="w-full p-2 border rounded">
        @for (cat of categories(); track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1">
      질문
      <input [ngModel]="question()" (ngModelChange)="question.set($event)"
        name="question" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      답변
      <textarea [ngModel]="answer()" (ngModelChange)="answer.set($event)"
        name="answer" rows="6" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">수정</button>
      <button type="button" (click)="deleteFaq()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
