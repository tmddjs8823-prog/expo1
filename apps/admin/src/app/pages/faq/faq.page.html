<div class="flex flex-col gap-5">
    <app-page-header title="FAQ 관리" />

    <form (ngSubmit)="isEditing() ? updateFaq() : createFaq()"
      class="bg-white rounded-xl border-2 border-slate-200 shadow-sm overflow-hidden">

      <!-- 폼 헤더 -->
      <div class="px-6 py-4 bg-primary-50 border-b-2 border-primary-200 text-primary-800">
        <h3 class="text-sm font-semibold tracking-wide">{{ isEditing() ? '✏️ FAQ 수정' : '➕ 새 FAQ 작성' }}</h3>
      </div>

      <div class="p-6 flex flex-col gap-5">
        <!-- 카테고리 선택 + 관리 -->
        <div class="flex flex-col gap-3">
          <span class="text-sm font-bold text-slate-800">카테고리</span>
          <div class="flex items-center gap-2">
            <select [ngModel]="selectedCategoryId()" (ngModelChange)="selectedCategoryId.set($event)"
              name="categoryId" class="flex-1 px-3 py-2.5 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all">
              <option [ngValue]="null" disabled>카테고리 선택</option>
              @for (cat of categories(); track cat.id) {
                <option [ngValue]="cat.id">{{ cat.name }}</option>
              }
            </select>
            <button type="button" (click)="showNewCategory.set(!showNewCategory())"
              class="px-4 py-2.5 text-sm font-semibold border-2 rounded-lg whitespace-nowrap transition-all"
              [class.bg-primary-50]="showNewCategory()" [class.border-primary-400]="showNewCategory()" [class.text-primary-700]="showNewCategory()"
              [class.border-slate-200]="!showNewCategory()" [class.text-slate-600]="!showNewCategory()" [class.hover:bg-slate-50]="!showNewCategory()">
              {{ showNewCategory() ? '✕ 취소' : '+ 카테고리' }}
            </button>
          </div>

          @if (showNewCategory()) {
            <div class="flex items-center gap-2 p-3 bg-blue-50 border border-blue-200 rounded-lg">
              <input type="text" [ngModel]="newCategoryName()" (ngModelChange)="newCategoryName.set($event)"
                name="newCategory" placeholder="새 카테고리 이름" class="flex-1 px-3 py-2 border-2 border-blue-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400/30 focus:border-blue-400 transition-all" />
              <button type="button" (click)="createCategory()"
                class="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 shadow-sm transition-colors">추가</button>
            </div>
          }

          @if (showNewCategory() && categories().length > 0) {
            <div class="flex flex-wrap gap-2">
              @for (cat of categories(); track cat.id) {
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 border border-slate-200 rounded-full text-sm font-medium text-slate-700">
                  {{ cat.name }}
                  <button type="button" (click)="deleteCategory(cat.id)"
                    class="w-4 h-4 rounded-full bg-slate-300 hover:bg-red-500 hover:text-white text-slate-500 flex items-center justify-center text-xs transition-colors">&times;</button>
                </span>
              }
            </div>
          }
        </div>

        <hr class="border-slate-200" />

        <label class="flex flex-col gap-2">
          <span class="text-sm font-bold text-slate-800">질문</span>
          <input type="text" [ngModel]="question()" (ngModelChange)="question.set($event)" name="question" placeholder="질문을 입력하세요"
            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all">
        </label>

        <label class="flex flex-col gap-2">
          <span class="text-sm font-bold text-slate-800">답변</span>
          <textarea [ngModel]="answer()" (ngModelChange)="answer.set($event)" name="answer" placeholder="답변을 입력하세요" rows="5"
            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all resize-none"></textarea>
        </label>

        <label class="inline-flex items-center gap-2.5 text-sm font-medium select-none cursor-pointer text-slate-700 w-fit">
          <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
            name="published" class="w-5 h-5 rounded border-2 border-slate-300 text-primary-600 focus:ring-primary-500 focus:ring-2" />
          공개
        </label>

        <div class="flex gap-2.5 pt-2">
          <button type="submit"
            class="px-6 py-2.5 bg-primary-600 text-white text-sm font-bold rounded-lg hover:bg-primary-700 shadow-md shadow-primary-600/20 transition-all active:scale-[0.98]">
            {{ isEditing() ? '수정하기' : '생성하기' }}
          </button>
          @if (isEditing()) {
            <button type="button" (click)="resetForm()"
              class="px-6 py-2.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg hover:bg-slate-200 border border-slate-200 transition-colors">
              취소
            </button>
          }
        </div>
      </div>
    </form>

  <!-- FAQ 목록 -->
  <app-data-grid
    [option]="gridOption"
    (rowClick)="router.navigate(['/faq', $event.id])" />
</div>
