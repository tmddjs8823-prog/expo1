<div class="flex flex-col gap-4 p-6">
    <h1 class="text-2xl font-bold">FAQ 관리</h1>
    <form (ngSubmit) = "isEditing() ? updateFaq() : createFaq()" class="bg-white p-6 rounded shadow flex flex-col gap-4">
        <!-- 카테고리 선택 + 관리 -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <select [ngModel]="selectedCategoryId()" (ngModelChange)="selectedCategoryId.set($event)"
              name="categoryId" class="flex-1 p-2 border rounded">
              <option [ngValue]="null" disabled>카테고리 선택</option>
              @for (cat of categories(); track cat.id) {
                <option [ngValue]="cat.id">{{ cat.name }}</option>
              }
            </select>
            <button type="button" (click)="showNewCategory.set(!showNewCategory())"
              class="px-3 py-2 text-sm border rounded hover:bg-gray-50 whitespace-nowrap"
              [class.bg-blue-50]="showNewCategory()" [class.border-blue-300]="showNewCategory()">
              {{ showNewCategory() ? '취소' : '+ 카테고리' }}
            </button>
          </div>

          <!-- 새 카테고리 생성 -->
          @if (showNewCategory()) {
            <div class="flex items-center gap-2 pl-1">
              <input type="text" [ngModel]="newCategoryName()" (ngModelChange)="newCategoryName.set($event)"
                name="newCategory" placeholder="새 카테고리 이름" class="flex-1 p-2 border rounded text-sm" />
              <button type="button" (click)="createCategory()"
                class="bg-green-600 text-white px-3 py-2 text-sm rounded hover:bg-green-700">추가</button>
            </div>
          }

          <!-- 기존 카테고리 목록 (삭제 가능) -->
          @if (showNewCategory() && categories().length > 0) {
            <div class="flex flex-wrap gap-2 pl-1">
              @for (cat of categories(); track cat.id) {
                <span class="inline-flex items-center gap-1 px-2 py-1 bg-gray-100 rounded text-sm">
                  {{ cat.name }}
                  <button type="button" (click)="deleteCategory(cat.id)"
                    class="text-red-500 hover:text-red-700 font-bold">&times;</button>
                </span>
              }
            </div>
          }
        </div>
        <input type="text" [ngModel]="question()" (ngModelChange) = "question.set($event)" name="question" placeholder="질문" class="w-full p-2 border rounded"> <!--질문입력창-->
        <textarea [ngModel]="answer()" (ngModelChange) = "answer.set($event)" name="answer" placeholder="답변" rows="4" class="w-full p-2 border rounded"></textarea> <!--답변입력창-->
        <!-- 공개여부 -->
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
            name="published" class="w-4 h-4" />
          공개
        </label>
        <!--버튼선택-->
        <div class="flex gap-2">
      <button type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        {{ isEditing() ? '수정' : '생성' }}
      </button>


       @if (isEditing()) {
        <button type="button" (click)="resetForm()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          취소
        </button>
      }
    </div>
  </form>

  <!-- ── FAQ 목록 (공통 그리드) ── -->
  <app-data-grid
    [items]="pagedFaqs()"
    [searchKeyword]="searchKeyword()"
    (searchChange)="searchKeyword.set($event)"
    searchPlaceholder="질문, 답변, 카테고리로 검색"
    emptyMessage="등록된 FAQ가 없습니다."
    [columns]="['카테고리','질문','상태','작성일','관리']"
    [rowClickable]="true"
    (rowClick)="router.navigate(['/faq', $event.id])"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)">

    <ng-template appGridRow let-faq>
      <td class="p-3 truncate" [title]="faq.category?.name ?? '-'">{{ faq.category?.name ?? '-' }}</td>
      <td class="p-3 truncate" [title]="faq.question">{{ faq.question }}</td>  
      <td class="p-3">
        <span [class]="faq.published ? 'text-green-600' : 'text-red-500'">{{ faq.published ? '공개' : '비공개' }}</span>
      </td>
      <td class="p-3 whitespace-nowrap">{{ faq.createdAt | date:'yy-MM-dd' }}</td>
      <td class="p-3">
        <button (click)="$event.stopPropagation(); deleteFaq(faq.id)"
          class="text-red-600 hover:underline">삭제</button>
      </td>
    </ng-template>
  </app-data-grid>
</div>
