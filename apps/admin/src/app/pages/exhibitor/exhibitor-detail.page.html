<div class="flex flex-col gap-4 p-6">
  <div class="flex items-center gap-4">
    <button (click)="goBack()" class="text-gray-500 hover:text-gray-700">← 목록</button>
    <h1 class="text-2xl font-bold">참가업체 상세</h1>
  </div>

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateExhibitor()">
    <div class="flex flex-col md:flex-row gap-4">
      <label class="flex flex-col gap-1 flex-1">
        업체명
        <input [ngModel]="exhibitorForm().companyName"
          (ngModelChange)="exhibitorForm.update(f => ({...f, companyName: $event}))"
          name="companyName" class="w-full p-2 border rounded" />
      </label>
      <label class="flex flex-col gap-1 flex-1">
        업체명 (EN)
        <input [ngModel]="exhibitorForm().companyNameEn"
          (ngModelChange)="exhibitorForm.update(f => ({...f, companyNameEn: $event}))"
          name="companyNameEn" class="w-full p-2 border rounded" />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      설명
      <textarea [ngModel]="exhibitorForm().description"
        (ngModelChange)="exhibitorForm.update(f => ({...f, description: $event}))"
        name="description" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex flex-col md:flex-row gap-4">
      <label class="flex flex-col gap-1 flex-1">
        전시회
        <select [ngModel]="exhibitorForm().exhibitionId"
          (ngModelChange)="exhibitorForm.update(f => ({...f, exhibitionId: $event}))"
          name="exhibitionId" class="w-full p-2 border rounded">
          @for (ex of exhibitions(); track ex.id) {
            <option [ngValue]="ex.id">{{ ex.title }}</option>
          }
        </select>
      </label>
      <label class="flex flex-col gap-1 flex-1">
        부스번호
        <input [ngModel]="exhibitorForm().boothNumber"
          (ngModelChange)="exhibitorForm.update(f => ({...f, boothNumber: $event}))"
          name="boothNumber" class="w-full p-2 border rounded" />
      </label>
    </div>

    <div class="flex flex-col md:flex-row gap-4">
      <label class="flex flex-col gap-1 flex-1">
        이메일
        <input type="email" [ngModel]="exhibitorForm().contactEmail"
          (ngModelChange)="exhibitorForm.update(f => ({...f, contactEmail: $event}))"
          name="contactEmail" class="w-full p-2 border rounded" />
      </label>
      <label class="flex flex-col gap-1 flex-1">
        전화번호
        <input [ngModel]="exhibitorForm().contactPhone"
          (ngModelChange)="exhibitorForm.update(f => ({...f, contactPhone: $event}))"
          name="contactPhone" class="w-full p-2 border rounded" />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      웹사이트
      <input [ngModel]="exhibitorForm().website"
        (ngModelChange)="exhibitorForm.update(f => ({...f, website: $event}))"
        name="website" class="w-full p-2 border rounded" />
    </label>

    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">수정</button>
      <button type="button" (click)="deleteExhibitor()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
