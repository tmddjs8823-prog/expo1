<div class="flex flex-col gap-4 p-6">
  <h1 class="text-2xl font-bold">사전등록 관리</h1>

  <!-- 검색 -->
  <div class="flex items-center gap-2">
    <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)"
      name="search" placeholder="이름, 이메일, 회사, 전화번호로 검색" class="flex-1 p-2 border rounded" />
  </div>

  <table class="w-full bg-white rounded shadow">
    <thead class="bg-gray-50">
      <tr>
        <th class="p-3 text-left">번호</th>
        <th class="p-3 text-left">이름</th>
        <th class="p-3 text-left">이메일</th>
        <th class="p-3 text-left">전화번호</th>
        <th class="p-3 text-left">회사</th>
        <th class="p-3 text-left">직책</th>
        <th class="p-3 text-left">등록일</th>
        <th class="p-3 text-left">관리</th>
      </tr>
    </thead>
    <tbody>
      @for (reg of filteredPreRegistrations(); track reg.id) {
        <tr class="border-t hover:bg-gray-50">
          <td class="p-3">{{ reg.id }}</td>
          <td class="p-3">{{ reg.name }}</td>
          <td class="p-3">{{ reg.email }}</td>
          <td class="p-3">{{ reg.phone }}</td>
          <td class="p-3">{{ reg.company }}</td>
          <td class="p-3">{{ reg.jobTitle }}</td>
          <td class="p-3">{{ reg.createdAt | date:'yyyy-MM-dd' }}</td>
          <td class="p-3">
            <button (click)="deletePreRegistration(reg.id)"
              class="text-red-600 hover:underline">삭제</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="8" class="p-6 text-center text-gray-400">등록된 사전등록이 없습니다.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
