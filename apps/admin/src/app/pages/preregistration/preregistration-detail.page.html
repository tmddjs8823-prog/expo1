<div class="flex flex-col gap-4">
  <app-page-header title="사전등록 상세" backLabel="목록" (backClick)="goBack()" />

  @if (registration()) {
    <div class="bg-white p-6 rounded shadow flex flex-col gap-4">
      <app-detail-fields [fields]="detailFields()" />

      <div class="border-t pt-4 flex gap-3 text-sm">
        <span class="px-2.5 py-1 rounded-full"
              [class.bg-green-100]="registration()!.agreeTerms"
              [class.text-green-700]="registration()!.agreeTerms"
              [class.bg-red-100]="!registration()!.agreeTerms"
              [class.text-red-600]="!registration()!.agreeTerms">
          이용약관 {{ registration()!.agreeTerms ? '동의' : '미동의' }}
        </span>
        <span class="px-2.5 py-1 rounded-full"
              [class.bg-green-100]="registration()!.agreeMarketing"
              [class.text-green-700]="registration()!.agreeMarketing"
              [class.bg-gray-100]="!registration()!.agreeMarketing"
              [class.text-gray-600]="!registration()!.agreeMarketing">
          마케팅 {{ registration()!.agreeMarketing ? '동의' : '미동의' }}
        </span>
      </div>

      <div class="flex gap-2 border-t pt-4">
        <button (click)="deleteRegistration()"
          class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
        <button (click)="goBack()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">목록으로</button>
      </div>
    </div>
  }
</div>
