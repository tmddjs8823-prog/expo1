<div class="flex flex-col gap-4">
  <app-page-header title="전시회 상세" backLabel="목록" (backClick)="goBack()" />

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateExhibition()">
    <div class="flex flex-col md:flex-row gap-4">
      <label class="flex flex-col gap-1 flex-1">
        제목
        <input [ngModel]="exhibitionForm().title"
          (ngModelChange)="exhibitionForm.update(f => ({...f, title: $event}))"
          name="title" class="w-full p-2 border rounded" />
      </label>
      <label class="flex flex-col gap-1 flex-1">
        제목 (EN)
        <input [ngModel]="exhibitionForm().titleEn"
          (ngModelChange)="exhibitionForm.update(f => ({...f, titleEn: $event}))"
          name="titleEn" class="w-full p-2 border rounded" />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      설명
      <textarea [ngModel]="exhibitionForm().description"
        (ngModelChange)="exhibitionForm.update(f => ({...f, description: $event}))"
        name="description" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <label class="flex flex-col gap-1">
      설명 (EN)
      <textarea [ngModel]="exhibitionForm().descriptionEn"
        (ngModelChange)="exhibitionForm.update(f => ({...f, descriptionEn: $event}))"
        name="descriptionEn" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex flex-col gap-1 flex-1">
        <span class="text-sm font-medium">시작일</span>
        <div class="flex gap-2">
          <input type="date" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)"
            name="startDate" (keydown)="$event.preventDefault()" class="flex-1 p-2 border rounded cursor-pointer" />
          <select [ngModel]="startHour()" (ngModelChange)="startHour.set($event)"
            name="startHour" class="w-20 p-2 border rounded">
            @for (h of hours24; track h) {
              <option [value]="h">{{ h }}시</option>
            }
          </select>
          <select [ngModel]="startMinute()" (ngModelChange)="startMinute.set($event)"
            name="startMinute" class="w-20 p-2 border rounded">
            @for (m of minuteOptions; track m) {
              <option [value]="m">{{ m }}분</option>
            }
          </select>
        </div>
      </div>
      <div class="flex flex-col gap-1 flex-1">
        <span class="text-sm font-medium">종료일</span>
        <div class="flex gap-2">
          <input type="date" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)"
            name="endDate" (keydown)="$event.preventDefault()" class="flex-1 p-2 border rounded cursor-pointer" />
          <select [ngModel]="endHour()" (ngModelChange)="endHour.set($event)"
            name="endHour" class="w-20 p-2 border rounded">
            @for (h of hours24; track h) {
              <option [value]="h">{{ h }}시</option>
            }
          </select>
          <select [ngModel]="endMinute()" (ngModelChange)="endMinute.set($event)"
            name="endMinute" class="w-20 p-2 border rounded">
            @for (m of minuteOptions; track m) {
              <option [value]="m">{{ m }}분</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4">
      <label class="flex flex-col gap-1 flex-1">
        장소
        <input [ngModel]="exhibitionForm().venue"
          (ngModelChange)="exhibitionForm.update(f => ({...f, venue: $event}))"
          name="venue" class="w-full p-2 border rounded" />
      </label>
      <label class="flex flex-col gap-1 flex-1">
        상태
        <select [ngModel]="exhibitionForm().status"
          (ngModelChange)="exhibitionForm.update(f => ({...f, status: $event}))"
          name="status" class="w-full p-2 border rounded">
          <option value="DRAFT">예정</option>
          <option value="PUBLISHED">진행중</option>
          <option value="CLOSED">종료</option>
        </select>
      </label>
    </div>

    <label class="flex flex-col gap-1">
      클릭 시 이동 링크
      <input [ngModel]="exhibitionForm().linkUrl"
        (ngModelChange)="exhibitionForm.update(f => ({...f, linkUrl: $event}))"
        name="linkUrl" placeholder="https://example.com (선택)" class="w-full p-2 border rounded" />
    </label>

    <label class="flex items-center gap-2 text-sm select-none cursor-pointer">
      <input type="checkbox" [ngModel]="exhibitionForm().published"
        (ngModelChange)="exhibitionForm.update(f => ({...f, published: $event}))"
        name="published" class="w-4 h-4" />
      공개
    </label>

    <!-- 이미지 -->
    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-gray-700">전시회 이미지</span>
      @if (exhibitionForm().imageUrl) {
        <img [src]="exhibitionForm().imageUrl" alt="미리보기"
             class="w-full max-h-48 object-cover rounded border" />
      }
      <input #exDetailFileInput type="file" accept="image/*" (change)="onFileSelected($event)"
             class="hidden" />
      <button type="button" (click)="exDetailFileInput.click()"
        class="px-4 py-2 bg-gray-100 border rounded hover:bg-gray-200 text-sm text-gray-700 w-fit">
        파일 선택
      </button>
    </div>

    <div class="flex gap-2">
      <button type="submit" [disabled]="uploading()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
        {{ uploading() ? '업로드 중...' : '수정' }}
      </button>
      <button type="button" (click)="deleteExhibition()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
