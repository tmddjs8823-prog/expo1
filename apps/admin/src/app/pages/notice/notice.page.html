<div class="p-6">
  <h1 class="text-2xl font-bold mb-6">공지사항 관리</h1>

  <!-- ── 생성/수정 폼 ── -->
  <form (ngSubmit)="isEditing() ? updateNotice() : createNotice()"
    class="bg-white p-6 rounded shadow mb-6 flex flex-col gap-4">

    <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)"
      name="title" placeholder="제목" class="w-full p-2 border rounded" />

    <textarea [ngModel]="content()" (ngModelChange)="content.set($event)"
      name="content" placeholder="내용" rows="4" class="w-full p-2 border rounded"></textarea>

    <div class="flex gap-2">
      <button type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        {{ isEditing() ? '수정' : '생성' }}
      </button>

      @if (isEditing()) {
        <button type="button" (click)="resetForm()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          취소
        </button>
      }
    </div>

<label class="flex items-center gap-2 text-sm select-none cursor-pointer">
      <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
        name="published" class="w-4 h-4" />
      공개
    </label>    
  </form>

  <!-- 검색 -->
  <div class="flex items-center gap-2 mb-2">
    <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)"
      name="search" placeholder="제목, 내용으로 검색" class="flex-1 p-2 border rounded" />
  </div>

  <!-- ── 공지사항 목록 ── -->
  <div class="overflow-x-auto w-full bg-white rounded-lg shadow-sm border border-slate-100">
    <table class="w-full min-w-[700px] table-fixed">
      <thead class="bg-gray-50">
        <tr>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">번호</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">제목</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">공개여부</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">작성일</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">관리</th>
        </tr>
      </thead>
      <tbody>
        @for (notice of pagedNotices(); track notice.id) {
          <tr class="border-t hover:bg-slate-50 transition-colors cursor-pointer text-slate-700 text-sm" (click)="router.navigate(['/notice', notice.id])">
            <td class="p-3">{{ notice.id }}</td>
            <td class="p-3 truncate" [title]="notice.title">{{ notice.title }}</td>
            <td class="p-3">
              <span [class]="notice.published ? 'text-green-600' : 'text-slate-400'">{{ notice.published ? '공개' : '비공개' }}</span>
            </td>
            <td class="p-3">{{ notice.createdAt | date:'yy-MM-dd' }}</td>
            <td class="p-3">
              <button (click)="$event.stopPropagation(); deleteNotice(notice.id)"
                class="text-red-600 hover:underline">삭제</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="p-6 text-center text-slate-400">등록된 공지사항이 없습니다.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)" />
</div>
