<div class="p-6">
  <h1 class="text-2xl font-bold mb-6">공지사항 관리</h1>

  <!-- ── 생성/수정 폼 ── -->
  <form (ngSubmit)="isEditing() ? updateNotice() : createNotice()"
    class="bg-white p-6 rounded shadow mb-6 flex flex-col gap-4">

    <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)"
      name="title" placeholder="제목" class="w-full p-2 border rounded" />

    <textarea [ngModel]="content()" (ngModelChange)="content.set($event)"
      name="content" placeholder="내용" rows="4" class="w-full p-2 border rounded"></textarea>

    <div class="flex gap-2">
      <button type="submit"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        {{ isEditing() ? '수정' : '생성' }}
      </button>

      @if (isEditing()) {
        <button type="button" (click)="resetForm()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          취소
        </button>
      }
    </div>

<label class="flex items-center gap-2 text-sm select-none cursor-pointer">
      <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
        name="published" class="w-4 h-4" />
      공개
    </label>    
  </form>

  <!-- 공지사항 목록 (공통 그리드) -->
  <app-data-grid
    [option]="gridOption"
    (rowClick)="router.navigate(['/notice', $event.id])" />
</div>
