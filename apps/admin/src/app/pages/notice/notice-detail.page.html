<div class="flex flex-col gap-4 p-6">
  <div class="flex items-center gap-4">
    <button (click)="goBack()" class="text-gray-500 hover:text-gray-700">← 목록</button>
    <h1 class="text-2xl font-bold">공지사항 상세</h1>
  </div>

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateNotice()">
    <label class="flex flex-col gap-1">
      제목
      <input [ngModel]="title()" (ngModelChange)="title.set($event)"
        name="title" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      내용
      <textarea [ngModel]="content()" (ngModelChange)="content.set($event)"
        name="content" rows="8" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">수정</button>
      <button type="button" (click)="deleteNotice()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
