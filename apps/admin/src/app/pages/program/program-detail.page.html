<div class="flex flex-col gap-4">
  <app-page-header title="프로그램 상세" backLabel="목록" (backClick)="goBack()" />

  <form class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-4" (ngSubmit)="updateProgram()">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">제목</span>
      <input [ngModel]="programForm().title"
        (ngModelChange)="programForm.update(f => ({...f, title: $event}))"
        name="title" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">제목 (EN)</span>
      <input [ngModel]="programForm().titleEn"
        (ngModelChange)="programForm.update(f => ({...f, titleEn: $event}))"
        name="titleEn" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">발표자</span>
      <input [ngModel]="programForm().speaker"
        (ngModelChange)="programForm.update(f => ({...f, speaker: $event}))"
        name="speaker" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">발표자 (EN)</span>
      <input [ngModel]="programForm().speakerEn"
        (ngModelChange)="programForm.update(f => ({...f, speakerEn: $event}))"
        name="speakerEn" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">설명</span>
      <textarea [ngModel]="programForm().description"
        (ngModelChange)="programForm.update(f => ({...f, description: $event}))"
        name="description" rows="4" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all resize-none"></textarea>
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">설명 (EN)</span>
      <textarea [ngModel]="programForm().descriptionEn"
        (ngModelChange)="programForm.update(f => ({...f, descriptionEn: $event}))"
        name="descriptionEn" rows="4" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all resize-none"></textarea>
    </label>

    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex flex-col gap-1 flex-1">
        <span class="text-sm font-medium text-slate-700">시작 시간</span>
        <div class="flex gap-2">
          <input type="date" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)"
            name="startDate" (keydown)="$event.preventDefault()" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
          <select [ngModel]="startHour()" (ngModelChange)="startHour.set($event)"
            name="startHour" class="w-20 px-2 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500">
            @for (h of hours24; track h) {
              <option [value]="h">{{ h }}시</option>
            }
          </select>
          <select [ngModel]="startMinute()" (ngModelChange)="startMinute.set($event)"
            name="startMinute" class="w-20 px-2 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500">
            @for (m of minutes; track m) {
              <option [value]="m">{{ m }}분</option>
            }
          </select>
        </div>
      </div>
      <div class="flex flex-col gap-1 flex-1">
        <span class="text-sm font-medium text-slate-700">종료 시간</span>
        <div class="flex gap-2">
          <input type="date" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)"
            name="endDate" (keydown)="$event.preventDefault()" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-lg text-sm cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
          <select [ngModel]="endHour()" (ngModelChange)="endHour.set($event)"
            name="endHour" class="w-20 px-2 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500">
            @for (h of hours24; track h) {
              <option [value]="h">{{ h }}시</option>
            }
          </select>
          <select [ngModel]="endMinute()" (ngModelChange)="endMinute.set($event)"
            name="endMinute" class="w-20 px-2 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500">
            @for (m of minutes; track m) {
              <option [value]="m">{{ m }}분</option>
            }
          </select>
        </div>
      </div>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-medium text-slate-700">장소</span>
      <input [ngModel]="programForm().location"
        (ngModelChange)="programForm.update(f => ({...f, location: $event}))"
        name="location" class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all" />
    </label>

    <label class="flex items-center gap-2 text-sm select-none cursor-pointer text-slate-700">
      <input type="checkbox" [ngModel]="programForm().published"
        (ngModelChange)="programForm.update(f => ({...f, published: $event}))"
        name="published" class="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
      공개
    </label>

    <div class="flex gap-2">
      <button type="submit" class="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 shadow-sm transition-colors">수정</button>
      <button type="button" (click)="deleteProgram()" class="px-4 py-2 bg-red-50 text-red-600 text-sm font-medium rounded-lg hover:bg-red-100 transition-colors">삭제</button>
      <button type="button" (click)="goBack()" class="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-lg hover:bg-slate-200 transition-colors">취소</button>
    </div>
  </form>
</div>
