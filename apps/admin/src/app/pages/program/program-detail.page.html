<div class="flex flex-col gap-4 p-6">
  <div class="flex items-center gap-4">
    <button (click)="goBack()" class="text-gray-500 hover:text-gray-700">← 목록</button>
    <h1 class="text-2xl font-bold">프로그램 상세</h1>
  </div>

  <form class="bg-white p-6 rounded shadow flex flex-col gap-4" (ngSubmit)="updateProgram()">
    <label class="flex flex-col gap-1">
      제목
      <input [ngModel]="programForm().title"
        (ngModelChange)="programForm.update(f => ({...f, title: $event}))"
        name="title" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      제목 (EN)
      <input [ngModel]="programForm().titleEn"
        (ngModelChange)="programForm.update(f => ({...f, titleEn: $event}))"
        name="titleEn" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      발표자
      <input [ngModel]="programForm().speaker"
        (ngModelChange)="programForm.update(f => ({...f, speaker: $event}))"
        name="speaker" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      발표자 (EN)
      <input [ngModel]="programForm().speakerEn"
        (ngModelChange)="programForm.update(f => ({...f, speakerEn: $event}))"
        name="speakerEn" class="w-full p-2 border rounded" />
    </label>

    <label class="flex flex-col gap-1">
      설명
      <textarea [ngModel]="programForm().description"
        (ngModelChange)="programForm.update(f => ({...f, description: $event}))"
        name="description" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <label class="flex flex-col gap-1">
      설명 (EN)
      <textarea [ngModel]="programForm().descriptionEn"
        (ngModelChange)="programForm.update(f => ({...f, descriptionEn: $event}))"
        name="descriptionEn" rows="4" class="w-full p-2 border rounded"></textarea>
    </label>

    <div class="flex gap-4">
      <label class="flex flex-col gap-1 flex-1">
        시작 시간
        <input type="datetime-local" [ngModel]="programForm().startTime"
          (ngModelChange)="updateDateTime('startTime', $event)"
          name="startTime" min="2000-01-01T00:00" max="2099-12-31T23:59" class="p-2 border rounded" />
      </label>
      <label class="flex flex-col gap-1 flex-1">
        종료 시간
        <input type="datetime-local" [ngModel]="programForm().endTime"
          (ngModelChange)="updateDateTime('endTime', $event)"
          name="endTime" min="2000-01-01T00:00" max="2099-12-31T23:59" class="p-2 border rounded" />
      </label>
    </div>

    <label class="flex flex-col gap-1">
      장소
      <input [ngModel]="programForm().location"
        (ngModelChange)="programForm.update(f => ({...f, location: $event}))"
        name="location" class="w-full p-2 border rounded" />
    </label>

    <div class="flex gap-2">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">수정</button>
      <button type="button" (click)="deleteProgram()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">삭제</button>
      <button type="button" (click)="goBack()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">취소</button>
    </div>
  </form>
</div>
