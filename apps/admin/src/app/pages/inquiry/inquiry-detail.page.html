<div class="flex flex-col gap-5">
  <app-page-header title="문의 상세" backLabel="목록" (backClick)="goBack()" />

  @if (inquiry()) {
    <!-- 문의 내용 -->
    <div class="bg-white rounded-xl border-2 border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b-2 border-slate-200 text-slate-800 flex items-center justify-between">
        <h3 class="text-sm font-semibold tracking-wide">📨 문의 내용</h3>
        <span class="text-xs px-3 py-1 rounded-full font-bold border"
              [class.bg-amber-100]="inquiry()!.status === 'PENDING'"
              [class.text-amber-800]="inquiry()!.status === 'PENDING'"
              [class.border-amber-300]="inquiry()!.status === 'PENDING'"
              [class.bg-emerald-100]="inquiry()!.status === 'ANSWERED'"
              [class.text-emerald-800]="inquiry()!.status === 'ANSWERED'"
              [class.border-emerald-300]="inquiry()!.status === 'ANSWERED'"
              [class.bg-slate-200]="inquiry()!.status === 'CLOSED'"
              [class.text-slate-700]="inquiry()!.status === 'CLOSED'"
              [class.border-slate-300]="inquiry()!.status === 'CLOSED'">
          {{ statusLabel(inquiry()!.status) }}
        </span>
      </div>

      <div class="p-6 flex flex-col gap-5">
        <h2 class="text-lg font-bold text-slate-900">{{ inquiry()!.subject }}</h2>

        <app-detail-fields [fields]="detailFields()" />

        <div class="border-t-2 border-slate-100 pt-4">
          <span class="text-sm font-bold text-slate-800">문의 내용</span>
          <p class="mt-2 text-slate-700 whitespace-pre-line text-sm leading-relaxed bg-slate-50 p-4 rounded-lg border border-slate-100">{{ inquiry()!.content }}</p>
        </div>
      </div>
    </div>

    <!-- 답변 작성 -->
    <div class="bg-white rounded-xl border-2 border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 bg-primary-50 border-b-2 border-primary-200 text-primary-800">
        <h3 class="text-sm font-semibold tracking-wide">💬 답변 작성</h3>
      </div>

      <div class="p-6 flex flex-col gap-5">
        <textarea [ngModel]="answerText()" (ngModelChange)="answerText.set($event)"
          name="answer" placeholder="답변을 입력하세요" rows="5"
          class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all resize-none"></textarea>

        <div class="flex gap-2.5">
          <button (click)="submitAnswer()"
            class="px-6 py-2.5 bg-primary-600 text-white text-sm font-bold rounded-lg hover:bg-primary-700 shadow-md shadow-primary-600/20 transition-all active:scale-[0.98]">답변 저장</button>
          <button (click)="deleteInquiry()"
            class="px-5 py-2.5 bg-red-50 text-red-600 text-sm font-semibold rounded-lg hover:bg-red-100 border border-red-200 transition-colors">삭제</button>
          <button (click)="goBack()"
            class="px-5 py-2.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg hover:bg-slate-200 border border-slate-200 transition-colors">취소</button>
        </div>
      </div>
    </div>
  }
</div>
