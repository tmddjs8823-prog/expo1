<div class="flex flex-col gap-4 p-6">
  <h1 class="text-2xl font-bold">문의 관리</h1>

  <!-- ── 문의 목록 (공통 그리드) ── -->
  <app-data-grid
    [items]="pagedInquiries()"
    [searchKeyword]="searchKeyword()"
    (searchChange)="searchKeyword.set($event)"
    searchPlaceholder="이름, 제목, 이메일로 검색"
    emptyMessage="등록된 문의가 없습니다."
    [columns]="['이름','제목','상태','접수일','관리']"
    [rowClickable]="true"
    (rowClick)="router.navigate(['/inquiry', $event.id])"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)">

    <ng-template appGridRow let-inq>
      <td class="p-3">{{ inq.name }}</td>
      <td class="p-3">{{ inq.subject }}</td>
      <td class="p-3">
        @switch (inq.status) {
          @case ('PENDING') { <span class="text-blue-600">대기</span> }
          @case ('ANSWERED') { <span class="text-green-600">답변완료</span> }
          @case ('CLOSED') { <span class="text-red-500">종료</span> }
        }
      </td>
      <td class="p-3 whitespace-nowrap">{{ inq.createdAt | date:'yy-MM-dd' }}</td>
      <td class="p-3">
        <button (click)="$event.stopPropagation(); deleteInquiry(inq.id)"
          class="text-red-600 hover:underline">삭제</button>
      </td>
    </ng-template>
  </app-data-grid>
</div>
