<div class="flex flex-col gap-4 p-6">
  <h1 class="text-2xl font-bold">배너 관리</h1>

  <!-- 생성/수정 폼 -->
  <form (submit)="$event.preventDefault()"
    class="bg-white p-6 rounded shadow flex flex-col gap-4">

    <input type="text" [ngModel]="title()" (ngModelChange)="title.set($event)"
      name="title" placeholder="배너 제목" class="w-full p-2 border rounded" />

    <input type="text" [ngModel]="subtitle()" (ngModelChange)="subtitle.set($event)"
      name="subtitle" placeholder="부제 (선택)" class="w-full p-2 border rounded" />

    <input type="text" [ngModel]="linkUrl()" (ngModelChange)="linkUrl.set($event)"
      name="linkUrl" placeholder="클릭 시 이동할 링크 (선택)" class="w-full p-2 border rounded" />

    <!-- 이미지 업로드 -->
    <div class="flex flex-col gap-2">
      <span class="text-sm font-medium text-gray-700">배너 이미지</span>
      <input #bannerFileInput type="file" accept="image/*" (change)="onFileSelected($event)"
        class="hidden" />
      <button type="button" (click)="bannerFileInput.click()"
        class="px-4 py-2 bg-gray-100 border rounded hover:bg-gray-200 text-sm text-gray-700 w-fit">
        파일 선택
      </button>
      @if (imageUrl()) {
        <img [src]="imageUrl()" alt="미리보기" class="w-full max-h-48 object-cover rounded" />
      }
    </div>

    <div class="flex items-center gap-4">
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
          name="published" class="w-4 h-4" />
        공개
      </label>
      <label class="flex items-center gap-2 text-sm">
        순서
        <input type="number" [ngModel]="sortOrder()" (ngModelChange)="sortOrder.set($event)"
          name="sortOrder" min="0" class="w-20 p-2 border rounded" />
      </label>
    </div>

    <div class="flex gap-2">
      <button type="button" (click)="isEditing() ? updateBanner() : createBanner()" [disabled]="uploading()"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
        @if (uploading()) {
          업로드 중...
        } @else {
          {{ isEditing() ? '수정' : '생성' }}
        }
      </button>
      @if (isEditing()) {
        <button type="button" (click)="resetForm()"
          class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          취소
        </button>
      }
    </div>
  </form>

  <!-- 검색 -->
  <div class="flex items-center gap-2">
    <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)"
      name="search" placeholder="제목으로 검색" class="flex-1 p-2 border rounded" />
  </div>

  <!-- 배너 목록 -->
  <div class="overflow-x-auto w-full bg-white rounded-lg shadow-sm border border-slate-100">
    <table class="w-full min-w-[700px] table-fixed">
      <thead class="bg-gray-50">
        <tr>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">미리보기</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">제목</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">공개</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">순서</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">작성일</th>
          <th class="p-3 text-left text-slate-600 font-semibold text-sm">관리</th>
        </tr>
      </thead>
      <tbody>
        @for (banner of filteredBanners(); track banner.id) {
          <tr class="border-t hover:bg-slate-50 transition-colors text-slate-700 text-sm">
            <td class="p-3 align-middle">
              <img [src]="banner.imageUrl" [alt]="banner.title"
                class="w-32 h-16 object-cover rounded" />
            </td>
            <td class="p-3 align-middle truncate" [title]="banner.title">{{ banner.title }}</td>
            <td class="p-3 align-middle">{{ banner.published ? '공개' : '비공개' }}</td>
            <td class="p-3 align-middle">{{ banner.sortOrder }}</td>
            <td class="p-3 align-middle">{{ banner.createdAt | date:'yy-MM-dd' }}</td>
            <td class="p-3 align-middle whitespace-nowrap">
              <button (click)="editBanner(banner)"
                class="text-blue-600 hover:underline mr-3">수정</button>
              <button (click)="deleteBanner(banner.id)"
                class="text-red-600 hover:underline">삭제</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="p-6 text-center text-slate-400">등록된 배너가 없습니다.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
