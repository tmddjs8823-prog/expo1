<div class="flex flex-col gap-5">
  <app-page-header [title]="isCreateMode ? '배너 등록' : '배너 상세'" backLabel="목록" (backClick)="goBack()" />

  <form class="bg-white rounded-xl border-2 border-slate-200 shadow-sm overflow-hidden" (ngSubmit)="save()">
    <div class="px-6 py-4 bg-primary-50 border-b-2 border-primary-200 text-primary-800">
      <h3 class="text-sm font-semibold tracking-wide">{{ isCreateMode ? '➕ 새 배너 등록' : '✏️ 배너 수정' }}</h3>
    </div>

    <div class="p-6 flex flex-col gap-5">
      <!-- 전시회 선택 -->
      <label class="flex flex-col gap-2">
        <span class="text-sm font-bold text-slate-800">전시회 선택</span>
        <select [ngModel]="exhibitionId()" (ngModelChange)="exhibitionId.set($event ? +$event : null)"
          name="exhibitionId" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all">
          <option [ngValue]="null">전시회 없음</option>
          @for (ex of exhibitions(); track ex.id) {
            <option [ngValue]="ex.id">{{ ex.title }}</option>
          }
        </select>
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-bold text-slate-800">제목</span>
        <input [ngModel]="title()" (ngModelChange)="title.set($event)"
          name="title" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all" />
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-bold text-slate-800">부제 <span class="font-normal text-slate-400">(선택)</span></span>
        <input [ngModel]="subtitle()" (ngModelChange)="subtitle.set($event)"
          name="subtitle" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all" />
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-sm font-bold text-slate-800">링크 URL <span class="font-normal text-slate-400">(선택)</span></span>
        <input [ngModel]="linkUrl()" (ngModelChange)="linkUrl.set($event)"
          name="linkUrl" placeholder="https://" class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 focus:bg-white transition-all" />
      </label>

      <div class="flex flex-col gap-2">
        <span class="text-sm font-bold text-slate-800">배너 이미지</span>
        @if (imageUrl()) {
          <img [src]="imageUrl()" alt="미리보기" class="w-full max-h-48 object-cover rounded-xl border-2 border-slate-200 shadow-sm" />
        }
        <input #bannerDetailFileInput type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
        <button type="button" (click)="bannerDetailFileInput.click()"
          class="w-fit px-4 py-2.5 bg-slate-100 border-2 border-slate-200 rounded-lg hover:bg-slate-200 text-sm text-slate-700 font-semibold transition-colors flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
          </svg>
          파일 선택
        </button>
      </div>
      <div class="flex items-center gap-6">
        <label class="inline-flex items-center gap-2.5 text-sm font-medium select-none cursor-pointer text-slate-700 w-fit">
          <input type="checkbox" [ngModel]="published()" (ngModelChange)="published.set($event)"
            name="published" class="w-5 h-5 rounded border-2 border-slate-300 text-primary-600 focus:ring-primary-500" />
          공개
        </label>
        <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
          순서
          <input type="number" [ngModel]="sortOrder()" (ngModelChange)="sortOrder.set($event)"
            name="sortOrder" min="1" class="w-20 px-3 py-2 border-2 border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500" />
        </label>
      </div>

      <hr class="border-slate-200" />

      <div class="flex gap-2.5">
        <button type="submit" [disabled]="uploading()"
          class="px-6 py-2.5 bg-primary-600 text-white text-sm font-bold rounded-lg hover:bg-primary-700 shadow-md shadow-primary-600/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
          {{ uploading() ? '업로드 중...' : (isCreateMode ? '등록하기' : '수정하기') }}
        </button>
        @if (isCreateMode) {
          <button type="button" (click)="resetForm()" class="px-5 py-2.5 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg hover:bg-slate-200 border border-slate-200 transition-colors">초기화</button>
        } @else {
          <button type="button" (click)="deleteBanner()" class="px-5 py-2.5 bg-red-50 text-red-600 text-sm font-semibold rounded-lg hover:bg-red-100 border border-red-200 transition-colors">삭제</button>
        }
      </div>
    </div>
  </form>
</div>
