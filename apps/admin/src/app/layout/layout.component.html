<div class="flex flex-col md:flex-row h-screen bg-slate-50 overflow-hidden">
  <!-- 모바일 상단 헤더 -->
  <header class="flex md:hidden items-center justify-between bg-slate-900 text-white px-5 h-16 shadow-sm z-20 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center font-bold">A</div>
      <span class="font-bold text-lg tracking-tight">관리자 센터</span>
    </div>
    <button (click)="isMobileMenuOpen.set(!isMobileMenuOpen())" class="p-2 text-slate-400 hover:text-white transition-colors" aria-label="메뉴 토글">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (isMobileMenuOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </header>

  <!-- 사이드바 -->
  <aside 
    [class.translate-x-0]="isMobileMenuOpen()" 
    class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-slate-900 text-slate-300 flex flex-col p-5 gap-5 transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 h-full shrink-0 border-r border-slate-800"
  >
    <!-- 로고 -->
    <div class="hidden md:flex items-center gap-3 border-b border-slate-800 pb-4">
      <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center text-white font-bold">A</div>
      <h2 class="text-lg font-bold text-white tracking-tight">관리자 센터</h2>
    </div>

    <!-- 메뉴 목록 -->
    <nav class="flex-1 flex flex-col gap-1 overflow-y-auto">
      @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-primary-600 text-white shadow-sm" (click)="isMobileMenuOpen.set(false)"
          class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white text-sm font-medium transition-all duration-150">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- 로그아웃 -->
    <button (click)="logout(); isMobileMenuOpen.set(false)"
      class="w-full py-2.5 px-4 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm">
      로그아웃
    </button>
  </aside>

  <!-- 모바일 사이드바 배경 오버레이 -->
  @if (isMobileMenuOpen()) {
    <div (click)="isMobileMenuOpen.set(false)" (keyup.enter)="isMobileMenuOpen.set(false)"
         tabindex="0" role="button"
         class="md:hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-20 transition-opacity"></div>
  }

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 bg-slate-50 overflow-auto">
    <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </div>
  </main>
</div>
