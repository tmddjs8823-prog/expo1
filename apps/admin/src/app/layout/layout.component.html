<div class="flex h-screen">
  <!-- 사이드바 -->
  <aside class="w-64 bg-slate-800 text-white flex flex-col p-4 gap-4">
    <!-- 로고 -->
    <h2 class="text-lg font-bold border-b border-slate-600 pb-4">관리자</h2>

    <!-- 메뉴 목록 -->
    <nav class="flex-1 flex flex-col gap-1">
      @for (item of menuItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-slate-700"
          class="block px-3 py-2 rounded hover:bg-slate-700 text-sm">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- 로그아웃 -->
    <button (click)="logout()"
      class="w-full p-2 bg-red-600 rounded hover:bg-red-700 text-sm">
      로그아웃
    </button>
  </aside>

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 bg-gray-100 overflow-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <router-outlet />
    </div>
  </main>
</div>
