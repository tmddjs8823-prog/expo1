<div class="flex items-center justify-between mb-6">
  <div class="flex items-center gap-3">
    @if (backLabel()) {
      <button (click)="backClick.emit()"
        class="flex items-center gap-1 text-sm text-slate-500 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
        {{ backLabel() }}
      </button>
      <span class="text-slate-300">|</span>
    }
    <h1 class="text-xl font-bold text-slate-900">{{ title() }}</h1>
  </div>
  @if (actionLabel()) {
    <button (click)="actionClick.emit()"
      class="flex items-center gap-1.5 px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 active:bg-primary-800 shadow-sm transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      {{ actionLabel() }}
    </button>
  }
</div>
