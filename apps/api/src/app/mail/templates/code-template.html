<!-- 인증 코드 이메일 템플릿 -->
<div style="font-family:'Apple SD Gothic Neo',sans-serif;max-width:480px;margin:0 auto;padding:40px 24px;background:#fff;">
    <div style="text-align:center;margin-bottom:32px;">
        <h1 style="font-size:22px;font-weight:700;color:#0f172a;margin:0;">밀리언쇼</h1>
    </div>
    <div style="border:1px solid #e2e8f0;border-radius:16px;padding:32px;background:#fafafa;">
        <h2 style="font-size:18px;font-weight:700;color:#1e293b;margin:0 0 12px;">{{title}}</h2>
        <p style="color:#475569;margin:0 0 24px;">{{message}}</p>
        <div style="text-align:center;padding:24px;background:#fff;border:2px dashed #e2e8f0;border-radius:12px;margin-bottom:20px;">
            <span style="font-size:36px;font-weight:800;letter-spacing:12px;color:#0f172a;">{{code}}</span>
        </div>
        <p style="color:#94a3b8;font-size:13px;margin:0;">{{note}}</p>
    </div>
    <p style="text-align:center;color:#cbd5e1;font-size:12px;margin-top:24px;">
        © 2026 밀리언쇼. All rights reserved.
    </p>
</div>
